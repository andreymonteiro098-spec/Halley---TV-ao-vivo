plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.halleytelecom.play'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.halleytelecom.play"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
